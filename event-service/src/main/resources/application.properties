spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${EVENT_PORT:8082}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.application.name=event-service

spring.datasource.url=${EVENT_DB_URL:jdbc:postgresql://localhost:5432/event_db}
spring.datasource.username=${EVENT_DB_USER:postgres}
spring.datasource.password=${EVENT_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:tazkara}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=5
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=event-scheduler-

tazkara.security.jwt.secret=${JWT_SECRET}
tazkara.security.jwt.issuer=${JWT_ISSUER:tazkara-identity}
tazkara.security.internal-api-key=${INTERNAL_API_KEY}

tazkara.outbox.relay-interval=${OUTBOX_RELAY_INTERVAL:PT2S}

tazkara.demo.enabled=${DEMO_DATA_ENABLED:true}
tazkara.demo.organizer-id=${DEMO_ORGANIZER_ID:1}

tazkara.openapi.title=Tazkara Event Service
tazkara.openapi.description=Events and ticket types 

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

