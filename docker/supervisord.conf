; Runs every process of the Tazkara container. All output goes to the container log (docker compose logs).
; Included by the package's /etc/supervisor/supervisord.conf, which already defines [supervisord].

[program:postgres]
command=/opt/pgbin/postgres -D /var/lib/tazkara/postgres -c listen_addresses=localhost
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
environment=HOME="/var/lib/tazkara/rabbitmq",RABBITMQ_MNESIA_BASE="/var/lib/tazkara/rabbitmq/mnesia",RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_LOGS="-"
priority=10
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:identity-service]
command=/opt/tazkara/bin/run-service.sh identity
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:event-service]
command=/opt/tazkara/bin/run-service.sh event
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:booking-service]
command=/opt/tazkara/bin/run-service.sh booking
environment=EVENT_SERVICE_URL="http://localhost:8082"
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
